<footer class="bg-tlgray-100">
  {{ if not .IsHome }}
  <script>
    function OnClickURL() {
      const url = document.getElementById("url").dataset.clipboardText;
      navigator.clipboard.writeText(url).then(function() {
        alert('Copied the URL and title.');
      }).catch(function(error) {
        console.error('Copy failed', error);
      });
    }
  </script>
  {{ end }}
  <script>
    (function () {
      const btn = document.getElementById("hamburgerbtn");
      const overlay = document.getElementById("overlay");
      const body = document.body;
      const isOpen = () => overlay.classList.contains("open");

      // 메뉴 열기/닫기 + 접근성 정보 갱신
      function setMenu(open) {
        overlay.classList.toggle("open", open);
        btn.classList.toggle("is-open", open);
        body.classList.toggle("scroll-lock", open);
        btn.setAttribute("aria-expanded", open);
        btn.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
        overlay.setAttribute("aria-hidden", !open);
        if (open) {
          const first = overlay.querySelector("a");
          if (first) first.focus();
        }
      }

      btn.addEventListener("click", () => setMenu(!isOpen()));

      document.addEventListener("keydown", (e) => {
        if (!isOpen()) return;

        // Esc 키로 닫고 버튼으로 초점 돌려주기
        if (e.key === "Escape") {
          setMenu(false);
          btn.focus();
          return;
        }

        // 열린 동안 Tab이 메뉴(X 버튼 + 링크) 안에서만 돌게 하기
        if (e.key === "Tab") {
          const items = [btn, ...overlay.querySelectorAll("a")];
          const i = items.indexOf(document.activeElement);
          const next = e.shiftKey
            ? (i <= 0 ? items.length - 1 : i - 1)
            : (i === items.length - 1 ? 0 : i + 1);
          e.preventDefault();
          items[next].focus();
        }
      });

      // 화면이 lg(1024px) 이상으로 넓어지면 자동으로 닫기
      window.matchMedia("(min-width: 1024px)").addEventListener("change", (e) => {
        if (e.matches && isOpen()) setMenu(false);
      });

      // 메뉴 링크를 누르면 닫기
      overlay.querySelectorAll("a").forEach((a) => {
        a.addEventListener("click", () => setMenu(false));
      });
    })();

    document.querySelector('.scroll-top').addEventListener('click', () => {
      // 키보드 사용자가 맨 위부터 다시 이동할 수 있게, 스크롤이 끝나면 초점을 로고로 옮기기
      const logo = document.querySelector('header nav a');
      const moveFocus = () => { if (logo) logo.focus({ preventScroll: true }); };
      if (window.scrollY === 0) { moveFocus(); return; }
      // 부드러운 스크롤이 맨 위에 도착한 뒤에 초점 이동 (중간에 옮기면 스크롤이 멈출 수 있음)
      const onScroll = () => {
        if (window.scrollY === 0) {
          window.removeEventListener('scroll', onScroll);
          moveFocus();
        }
      };
      window.addEventListener('scroll', onScroll);
      document.documentElement.scrollTop = 0;
    });
  </script>
  {{ if .Site.Params.googleFonts }}
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet" />
  {{ else }}
  <link href='{{ "css/webfonts.min.css" | relURL }}' rel="stylesheet" />
  {{ end }}
  <div class="flex items-center justify-between flex-wrap bg-gray-800 p-8 text-white">
    <div class="items-center text-xl text-grey-900 mr-6">
      {{ .Site.Params.site.name }}
    </div>
    <div class="w-full block grow lg:flex lg:items-center lg:w-auto" id="mobileMenu">
      <div class="text-lg lg:grow">
      </div>
      <div class="flex flex-row items-center text-lg">
        {{ range .Site.Menus.footer }}
        <a href="{{ .URL }}" class="block mt-4 lg:inline-block lg:mt-0 text-gray-300 hover:text-white mr-8">
          {{ if not .Pre }}
          {{ .Name }}
          {{ else }}
          {{ .Pre }}
          {{ end }}
        </a>
        {{ end }}
      </div>
    </div>
  </div>
  <div class="copy pl-8 py-5 bg-tlgray-700 text-white text-base">
    &copy; {{site.Title}} {{ now.Year }} All Rights Reserved.
  </div>
</footer>
